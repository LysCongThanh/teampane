name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - name: test (linux, full incl. e2e)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: test (macOS, unit only; e2e tracked in the macOS pane-readiness issue)
        if: runner.os == 'macOS'
        run: go test -race $(go list ./... | grep -v /internal/e2e)
